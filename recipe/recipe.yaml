context:
  name: airflow-laminar
  version: "1.18.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-laminar/airflow_laminar-${{ version }}.tar.gz
  sha256: 34bc97971757b46b4f73fa2ec8921aa0039d1d3930b038949256894db9c61466

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-balancer >=0.7.11,<0.8
    - airflow-common >=0.7.10,<0.8
    - airflow-config >=1.12.5,<1.13
    - airflow-ha >=1.6.5,<1.7
    - airflow-priority >=1.6.1,<1.7
    - airflow-pydantic >=1.7.0,<1.8
    - airflow-supervisor >=1.10.5,<1.12
    - supervisor-pydantic >=1.4.3,<1.6

tests:
  - python:
      imports:
        - airflow_laminar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Meta-repository for airflow-laminar tools
  homepage: https://github.com/airflow-laminar/airflow-laminar
  repository: https://github.com/airflow-laminar/airflow-laminar

extra:
  recipe-maintainers:
    - timkpaine
